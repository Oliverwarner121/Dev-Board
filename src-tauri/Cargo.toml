[package]
name = "devboard"
version = "0.1.0"
description = "A lightweight developer dashboard"
authors = ["DevBoard"]
edition = "2021"

[lib]
name = "devboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
